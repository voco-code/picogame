}

const get = path => JSON.parse(api('get', path).getContentText());

function tick() {
  const all = get('scheduled');
  if (!all)
    return;
  const now = Date.now();
  Object.keys(all).forEach(nick => {
    const items = all[nick] || {};
    Object.keys(items).forEach(id => {
      const v = items[id];
      if (!v || typeof v.at !== 'number' || v.at > now)
        return;
      const path = 'scheduled/' + nick + '/' + id;
      // забираем задачу атомарно (по ETag), чтобы её не отправили дважды
      const r = api('get', path, undefined, { 'X-Firebase-ETag': 'true' });
      const etag = r.getHeaders()['ETag'] || r.getHeaders()['Etag'] || r.getHeaders()['etag'];
      if (!etag || r.getContentText() === 'null')
        return;
      const d = api('delete', path, undefined, { 'if-match': etag });
      if (d.getResponseCode() >= 300)
        return;
      try {
        if (!allowed(nick, v))
          return;
        const msg = { from: nick, text: v.text.slice(0, 2000), ts: { '.sv': 'timestamp' } };
        if (typeof v.reply === 'string')
          msg.reply = v.reply.slice(0, 80);
        const p = api('post', v.path, msg);
        if (p.getResponseCode() >= 300)
          throw new Error(p.getContentText());
      }
      catch (e) {
        api('put', path, v); // вернуть в очередь, повторим через минуту
      }
    });
  });
}

function allowed(nick, v) {
  if (v.from !== nick || typeof v.path !== 'string' || typeof v.text !== 'string' || !v.text.trim())
    return false;
  const parts = v.path.split('/');
  if (parts[0] === 'messages' && parts.length === 3)
    return !!get('servers/' + parts[1] + '/members/' + nick);
  if (parts[0] === 'dm' && parts.length === 2) {
    const pair = parts[1];
    let other = null;
    if (pair.indexOf(nick + '_') === 0)
      other = pair.slice(nick.length + 1);
    else if (pair.slice(-(nick.length + 1)) === '_' + nick)
      other = pair.slice(0, -(nick.length + 1));
    return !!other && [nick, other].sort().join('_') === pair && get('users/' + nick + '/friends/' + other) === 'ok';
  }
  return false;
}
