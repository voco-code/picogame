<script>
firebase.initializeApp({apiKey:"AIzaSyDjy19NII3WL4vfhgBKEBatJsKTa2bflyA",authDomain:"uezchat-40870.firebaseapp.com",databaseURL:"https://uezchat-40870-default-rtdb.firebaseio.com",projectId:"uezchat-40870",storageBucket:"uezchat-40870.firebasestorage.app",messagingSenderId:"528005940919",appId:"1:528005940919:web:49bd9a30118f2f10692f32"});
const au=firebase.auth(),db=firebase.database(),$=s=>document.querySelector(s),app=$('#app'),TS=firebase.database.ServerValue.TIMESTAMP;
const K=s=>s.trim().toLowerCase().replace(/[.#$\[\]\/]/g,','),G=async p=>(await db.ref(p).once('value')).val();

const E=n=>{n=n.toLowerCase();let a=5381,b=52711;for(const c of n){const x=c.codePointAt(0);a=(a*33^x)>>>0;b=(b*31+x)>>>0}return'u'+a.toString(36)+b.toString(36)+n.length+'@uezchat.app'};let me,U={},SV={},FR={},cur='',mode='in',mode2,sid,ico='',ref0,mode3,W={},FU={};
document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());

function auth(err){cur='auth';const r=mode=='in';show(`<div class=card><h1>${r?'Вход':'Регистрация'}</h1><div class=mu>${r?'Войдите прямо сейчас в свой аккаунт.':'Наслаждайтесь общением прямо сейчас!'}</div><input id=i placeholder="Почта/номер телефона/никнейм" autocomplete=off><input id=p type=password placeholder="Пароль"><div class=mu style="color:#f23f43">${err||''}</div><button class=btn onclick=go()>${r?'Войти':'Зарегистрироваться'}</button><div class=mu>${r?`Совсем недавно? <a class=l onclick="mode='up';auth()">Регистрация</a>`:`Уже были? <a class="l gg" onclick="mode='in';auth()">Войти</a>`}</div></div>`,'auth')}
async function go(){const id=$('#i').value.trim(),pw=$('#p').value;if(!id||!pw)return auth('Заполните оба поля');
const k=K(id),ph=await H(pw),reg=mode=='up';cur='ld';show('<div class=dot></div>','ld');const t=sleep(6000);let nick;
try{if(!reg){nick=await G('idx/'+k);if(!nick){await t;return auth('Неверные данные')}await au.signInWithEmailAndPassword(E(nick),pw)}
else{if(await G('idx/'+k)){await t;return auth('Этот логин уже занят')}
const isP=/^\+?\d{10,15}$/.test(id);nick=(id.includes('@')?id.split('@')[0]:isP?'user'+id.slice(-4):id).replace(/[^\wа-яё]/gi,'').slice(0,20)||'user';
if(await G('idx/'+K(nick)))nick=nick.slice(0,15)+(Math.random()*9999|0);
const cr=await au.createUserWithEmailAndPassword(E(nick),pw);const u={nick,uid:cr.user.uid,contact:id,avatar:{bg:PAL[Math.random()*15|0],e:EM[Math.random()*EM.length|0]},status:'on',phoneLinked:isP,created:Date.now()};if(isP)u.phone=id;
await db.ref().update({['users/'+nick]:u,['idx/'+k]:nick,['idx/'+K(nick)]:nick,['nicks/'+cr.user.uid]:nick,['profiles/'+nick]:{avatar:u.avatar,status:'on',created:u.created}})}
me=nick;await new Promise(res=>{let f=1;db.ref('users/'+me).on('value',s=>{U=s.val()||{};fu(me);Object.keys(U.servers||{}).forEach(watch);Object.keys(U.friends||{}).forEach(fu);if(f){f=0;res()}else refresh()})});
if(!(await G('profiles/'+me)))await db.ref('profiles/'+me).set({avatar:U.avatar||{bg:PAL[0],e:'😎'},status:'on',created:U.created||Date.now()});await t;home()}catch(e){await t;auth(e.code=='auth/weak-password'?'Пароль минимум 6 символов':(e.code||'').startsWith('auth/')?'Неверные данные':'Ошибка сети')}}
function watch(id){if(W[id])return;W[id]=1;db.ref('servers/'+id).on('value',s=>{SV[id]=s.val();refresh()})}
function fu(n){if(FU[n])return;FU[n]=1;db.ref('profiles/'+n).on('value',x=>{PR[n]=x.val();refresh()})}
function refresh(){if($('.ov'))return;({home,n:notif,p:prof,w:welcome,srv:()=>openSrv(sid)})[cur]?.()}
function home(){cur='home';const rq=Object.keys(U.requests||{}),fr=Object.entries(U.friends||{}).filter(x=>x[1]=='ok').map(x=>x[0]);
show(`<div class=wrap>${rail('h')}<div class=main><div class=top><h1>Личные сообщения</h1></div><div class=body><button class="btn b" onclick=addF()>Добавить друзей</button>
${rq.map(n=>`<div class=li><b>${esc(n)}</b><span><a class=ic onclick="rq('${n}',0)">❌</a><a class=ic onclick="rq('${n}',1)">✅</a></span></div>`).join('')}
<div class=mu>Друзья — ${fr.length}</div>${fr.map(n=>{const p=pr(n);return`<div class=li onclick="openDM('${n}')">${av(p.avatar,p.status)}<b>${esc(n)}<div class=mu>${esc(lab(p))}</div></b></div>`}).join('')}</div></div></div>`+nav())}
function welcome(){if(Object.keys(U.servers||{}).length)return home();cur='w';show(`<div class=wrap>${rail('h')}<div class=main><div class="body c"><div style="font-size:80px">👋</div><h1>Привет, ${esc(me)}!</h1><div class=mu>Начните общение прямо сейчас выбирая две кнопки!</div><button class="btn s" onclick=join()>Войти по ссылке</button><button class="btn g" onclick=mkSrv()>Создать собственный сервер</button></div></div></div>`+nav())}
function join(){const m=modal(`<h1>Войти по ссылке</h1><input id=jc placeholder="Код сервера"><button class=btn id=jb>Войти</button>`);$('#jb').onclick=async()=>{const id=$('#jc').value.trim();if(!id||!(await G('servers/'+id+'/name')))return toast('Сервер не найден');await db.ref().update({['users/'+me+'/servers/'+id]:true,['servers/'+id+'/members/'+me]:true});cls(m);home()}}
async function mkSrv(){await ld(4);ico='';cur='mk';show(`<div class=top><a class=bk onclick=home()>‹</a></div><div class="body c"><h1>Создайте свой сервер</h1><div class=mu>Начните общаться, развлекаться, приглашаться на собственном сервере!</div><div class=pick id=pk onclick="$('#f').click()">+</div><input type=file id=f accept="image/*" hidden><input id=nm placeholder="Название сервера"><button class=btn id=cb>Создать</button></div>`);

$('#f').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);ico=c.toDataURL('image/jpeg',.8);$('#pk').innerHTML=`<img src="${ico}">`};im.src=URL.createObjectURL(f)};
$('#cb').onclick=async()=>{const name=$('#nm').value.trim();if(!name||!ico)return toast('Выберите файл и введите название');const b=$('#cb');b.className='btn s';b.textContent='Создание...';
const id=db.ref('servers').push().key;await db.ref().update({['servers/'+id]:{name,icon:ico,owner:me,created:Date.now(),members:{[me]:true}},['users/'+me+'/servers/'+id]:true});await sleep(4000);home()}}
function openSrv(id){cur='srv';sid=id;const s=SV[id];if(!s)return home();const ch=Object.entries(s.channels||{}),mb=Object.keys(s.members||{}),own=s.owner==me;
show(`<div class=wrap>${rail(id)}<div class=main><div class=top onclick=srvSet()><h1>${esc(s.name)} ▾</h1></div><div class=body ${ch.length?'':'style="align-items:center;text-align:center"'}>

${own?'<button class=btn onclick=mkCh()>Создать канал</button>':''}

async function openDM(n){const pair=[me,n].sort().join('_'),w=await G('dmMeta/'+pair+'/waved');chat('dm/'+pair,n,'home()',w?'':pair,n)}
function chat(path,title,back,pair,peer){cur='chat';CP=path;RP=null;MC={};show(`<div class=top><a class=bk onclick="${back}">‹</a><h1 ${peer?`onclick="showU('${peer}')"`:''}>${esc(title)}</h1></div><div class=body id=ml style="gap:0"></div>${pair?`<div class=bar id=wv><button class="btn s" onclick="wave('${path}','${pair}')">Помахать вашему другу 👋</button></div>`:''}<div id=rp></div><div class=bar><input id=mi placeholder="Сообщение" autocomplete=off><div class=send onclick=send()>➤</div></div>`);

${U.phoneLinked?'':`<div class=li style="flex-direction:column;align-items:stretch"><b>Защитите свой аккаунт</b><span class=mu>Привяжите номер телефона.</span><button class=btn onclick=ph()>Привязать</button></div>`}
<button class="btn g" onclick=stm()>Сменить статус</button><button class="btn s" onclick=edit()>Редактировать профиль</button><button class="btn s" onclick=bak()>Резервная копия (JSON)</button><button class="btn s" onclick="au.signOut().then(()=>location.reload())">Выйти</button></div>`+nav())}

function ph(){const m=modal(`<h1>Номер телефона</h1><input id=pn value="+" inputmode=tel><div class=mu>Только +1 и +7</div>`);let o='+';$('#pn').oninput=e=>{let v=e.target.value.replace(/[^\d+]/g,'');if(!/^\+([17]\d{0,10})?$/.test(v))v=o;e.target.value=o=v;if(v.length==12){db.ref('users/'+me).update({phone:v,phoneLinked:true});cls(m)}}}
function avm(){const a=pr(me).avatar;let bg=a.bg;const m=modal(`<h1>Создать аватар пользователя</h1><div class=row>${PAL.map(c=>`<div class="sw ${c==bg?'on':''}" style="background:${c}" data-c="${c}"></div>`).join('')}</div><input id=ae value="${a.e}" placeholder="Эмодзи"><button class=btn id=as>Сохранить</button>`);
m.querySelectorAll('.sw').forEach(x=>x.onclick=()=>{bg=x.dataset.c;m.querySelectorAll('.sw').forEach(y=>y.classList.toggle('on',y==x))});
$('#as').onclick=()=>{const e=Array.from($('#ae').value.trim())[0]||a.e;db.ref('profiles/'+me+'/avatar').set({bg,e});cls(m)}}
const ST={on:['Онлайн','#23a55a'],idle:['Неактивен','#f0b232'],dnd:['Не беспокоить','#f23f43'],off:['Невидимка','#80848e']},PR={};let CP,RP=null,MC={};
const cls=m=>{m.remove();refresh()},pr=n=>PR[n]||{avatar:{bg:'#555',e:'🙂'},status:'on'},lab=p=>p.status=='off'?'Не в сети':(p.custom||ST[p.status||'on'][0]);
const rail=a=>{const sv=Object.keys(U.servers||{});return`<div class=rail><div class=oc style="border-radius:${a=='h'?14:22}px" onclick="${sv.length?'home()':'welcome()'}">${sv.length?'💬':'👋'}</div><i style="width:32px;height:2px;background:#3f4147;flex:none"></i>${sv.map(i=>SV[i]?`<img class=sc style="border-radius:${a==i?14:22}px" src="${SV[i].icon||''}" onclick="openSrv('${i}')">`:'').join('')}<div class=sc style="background:#4e5058;color:#f23f43" onclick=mkSrv()>+</div></div>`};
const mh=(k,v)=>{fu(v.from);const p=pr(v.from),r=Object.entries(v.react||{}).map(([e,u])=>`<span class=rx onclick="react('${k}','${e}')">${e} ${Object.keys(u).length}</span>`).join('');return`<div class=av style="background:${p.avatar.bg};flex:none">${p.avatar.e}</div><div style="flex:1;min-width:0">${v.reply?`<div class=mu>↪ ${esc(v.reply)}</div>`:''}<b>${esc(v.from)}</b> <span class=mu>${new Date(v.ts||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${v.edited?' (изменено)':''}</span><div>${esc(v.text)}</div><div>${r}</div></div>`};
const react=(k,e)=>{const r=db.ref(CP+'/'+k+'/react/'+e+'/'+me);(MC[k].react&&MC[k].react[e]&&MC[k].react[e][me])?r.remove():r.set(true)};
function acts(k){const v=MC[k];if(!v)return;const own=v.from==me,m=modal(`<div class=row style="justify-content:center">${['👍','❤️','😂','😮','😢','🔥'].map(e=>`<span class=ic data-e="${e}">${e}</span>`).join('')}</div><button class="btn s" id=a1>Ответить</button>${own?'<button class="btn s" id=a2>Изменить</button><button class=btn style="background:#f23f43" id=a3>Удалить</button>':''}`);
m.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>{react(k,x.dataset.e);cls(m)});
$('#a1').onclick=()=>{RP=v.from+': '+v.text.slice(0,40);$('#rp').innerHTML=`<div class="bar mu" onclick="RP=null;this.remove()">↪ ${esc(RP)} ✕</div>`;cls(m);$('#mi').focus()};
if(own){$('#a2').onclick=()=>{cls(m);const m2=modal(`<input id=ed value="${esc(v.text)}"><button class=btn id=es>Сохранить</button>`);$('#es').onclick=()=>{const t=$('#ed').value.trim();if(t)db.ref(CP+'/'+k).update({text:t.slice(0,2000),edited:true});cls(m2)}};$('#a3').onclick=()=>{db.ref(CP+'/'+k).remove();cls(m)}}}
function srvSet(){const s=SV[sid],own=s.owner==me,m=modal(`<h1>${esc(s.name)}</h1><button class="btn s" id=ic>Скопировать код приглашения</button>${own?`<input id=rn value="${esc(s.name)}" maxlength=20><button class=btn id=rb>Переименовать</button><button class=btn style="background:#f23f43" id=dl>Удалить сервер</button>`:`<button class=btn style="background:#f23f43" id=lv>Покинуть сервер</button>`}`);
$('#ic').onclick=()=>{navigator.clipboard.writeText(sid);toast('Код скопирован')};
if(own){$('#rb').onclick=async()=>{const n=$('#rn').value.trim().slice(0,20);if(n)await db.ref('servers/'+sid+'/name').set(n);cls(m)};$('#dl').onclick=async()=>{if(!confirm('Удалить сервер навсегда?'))return;await db.ref().update({['servers/'+sid]:null,['users/'+me+'/servers/'+sid]:null});cls(m);home()}}
else $('#lv').onclick=async()=>{await db.ref().update({['servers/'+sid+'/members/'+me]:null,['users/'+me+'/servers/'+sid]:null});cls(m);home()}}
function edit(){const p=pr(me);let bn=p.banner||PAL[0];const m=modal(`<h1>Редактировать профиль</h1><div class=mu>Баннер</div><div class=row>${PAL.map(c=>`<div class="sw ${c==bn?'on':''}" style="background:${c}" data-c="${c}"></div>`).join('')}</div><div class=mu>О себе</div><input id=bi maxlength=120 value="${esc(p.bio||'')}"><button class=btn id=bs>Сохранить</button>`);
m.querySelectorAll('.sw').forEach(x=>x.onclick=()=>{bn=x.dataset.c;m.querySelectorAll('.sw').forEach(y=>y.classList.toggle('on',y==x))});
$('#bs').onclick=()=>{db.ref('profiles/'+me).update({banner:bn,bio:$('#bi').value.trim().slice(0,120)});cls(m)}}
const stm=()=>{const p=pr(me),m=modal(`<h1>Статус</h1>${Object.entries(ST).map(([k,v])=>`<button class="btn s" data-s="${k}" style="text-align:left"><span style="color:${v[1]}">●</span> ${v[0]}</button>`).join('')}<input id=cs maxlength=40 placeholder="Свой статус" value="${esc(p.custom||'')}"><button class=btn id=cb2>Сохранить текст</button>`);
m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{db.ref('profiles/'+me+'/status').set(b.dataset.s);cls(m)});$('#cb2').onclick=()=>{db.ref('profiles/'+me+'/custom').set($('#cs').value.trim());cls(m)}};
function bak(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({user:{...U,notifs:undefined},profile:PR[me],servers:SV},null,1)],{type:'application/json'}));a.download='uezchat-backup.json';a.click()}
auth();
</script></body></html>
