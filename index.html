<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UezChat</title>
<style>
:root{--bg:#313338;--b3:#1e1f22;--or:#f57c00;--gr:#23a55a;--tx:#dbdee1;--mu:#949ba4}
*{box-sizing:border-box;margin:0;font-family:"gg sans","Noto Sans","Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
html,body{height:100%;background:var(--b3);color:var(--tx);overflow:hidden}
#app{height:100%;position:relative}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.auth{background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url(https://i.ibb.co/WNGXwxCv/IMG-5975.jpg) center/cover;align-items:center;justify-content:center}
.card{background:var(--bg);border-radius:8px;padding:24px;width:min(92vw,400px);display:flex;flex-direction:column;gap:12px;text-align:center}
h1{color:#fff;font-size:22px}.mu{color:var(--mu);font-size:14px}
input{background:var(--b3);border:0;border-radius:4px;padding:12px;color:var(--tx);font-size:16px;width:100%;outline:0}
.btn{border:0;border-radius:4px;padding:12px;font-size:16px;font-weight:600;color:#fff;background:var(--or);width:100%}
.g{background:var(--gr)}.s{background:#4e5058}.b{color:#000}
.l{color:var(--or)}.gg{color:var(--gr)}a{cursor:pointer}
.ld{align-items:center;justify-content:center}
.dot{width:90px;height:90px;border-radius:50%;background:var(--or);animation:p 1.6s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.3;filter:brightness(.25)}}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:58px;border-bottom:1px solid #0003}
.top h1{font-size:18px;flex:1}.bk{font-size:32px;color:var(--mu);line-height:1;cursor:pointer}
.body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.c{align-items:center;text-align:center}
.tr{position:absolute;right:14px;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px;z-index:2}
.oc,.sc,.pick{width:44px;height:44px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;object-fit:cover;flex:none;cursor:pointer;overflow:hidden}
.pick{width:96px;height:96px;font-size:44px}.pick img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:10px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#2b2d31;border-radius:8px;justify-content:space-between}
.li b{color:#fff;flex:1}.ic{font-size:22px;padding:0 8px}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.pa{position:relative;width:64px}.pa .av{width:64px;height:64px;font-size:34px}
.st{position:absolute;right:0;bottom:0;width:18px;height:18px;border-radius:50%;background:var(--gr);border:3px solid var(--bg)}.st.off{background:#80848e}
nav{display:flex;background:#2b2d31;border-top:1px solid #0003}nav a{flex:1;text-align:center;padding:12px;font-size:24px}
.ov{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent}.sw.on{border-color:#fff}
.m{padding:6px 0}.m b{color:#fff;font-size:15px}.m div{white-space:pre-wrap;word-break:break-word}
.bar{display:flex;gap:8px;padding:10px;background:#2b2d31}.bar input{flex:1}
.send{width:44px;height:44px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;z-index:20}
pre{font-size:11px;color:var(--mu);white-space:pre-wrap;word-break:break-all;-webkit-user-select:none}
</style></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDjy19NII3WL4vfhgBKEBatJsKTa2bflyA",authDomain:"uezchat-40870.firebaseapp.com",databaseURL:"https://uezchat-40870-default-rtdb.firebaseio.com",projectId:"uezchat-40870",storageBucket:"uezchat-40870.firebasestorage.app",messagingSenderId:"528005940919",appId:"1:528005940919:web:49bd9a30118f2f10692f32"});
const au=firebase.auth(),db=firebase.database(),$=s=>document.querySelector(s),app=$('#app'),TS=firebase.database.ServerValue.TIMESTAMP;
const K=s=>s.trim().toLowerCase().replace(/[.#$\[\]\/]/g,','),G=async p=>(await db.ref(p).once('value')).val();
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const H=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}};
const PAL=['#f57c00','#e53935','#d81b60','#8e24aa','#5e35b1','#3949ab','#1e88e5','#039be5','#00acc1','#00897b','#43a047','#7cb342','#fdd835','#6d4c41','#546e7a'],EM=['😎','🦊','🐼','🐸','🚀','🎧','🔥','🍕','👾','🐯'];
const E=n=>{n=n.toLowerCase();let a=5381,b=52711;for(const c of n){const x=c.codePointAt(0);a=(a*33^x)>>>0;b=(b*31+x)>>>0}return'u'+a.toString(36)+b.toString(36)+n.length+'@uezchat.app'};let me,U={},SV={},FR={},cur='',mode='in',mode2,sid,ico='',ref0,mode3,W={},FU={};
document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());
const show=(h,c='')=>{app.innerHTML=`<div class="scr ${c}">${h}</div>`},
toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;app.appendChild(e);setTimeout(()=>e.remove(),2500)},
modal=h=>{const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class=card style="text-align:left">${h}</div>`;m.onclick=e=>{if(e.target==m)m.remove()};app.appendChild(m);return m},
ld=async s=>{cur='ld';show('<div class=dot></div>','ld');await sleep(s*1000)},
av=a=>{a=a||{bg:'#555',e:'🙂'};return`<div class=av style="background:${a.bg}">${a.e}</div>`},
nav=t=>`<nav><a onclick=home()>🏠</a><a onclick=notif()>🔔</a><a onclick=prof()>👤</a></nav>`;
function auth(err){cur='auth';const r=mode=='in';show(`<div class=card><h1>${r?'Вход':'Регистрация'}</h1><div class=mu>${r?'Войдите прямо сейчас в свой аккаунт.':'Наслаждайтесь общением прямо сейчас!'}</div><input id=i placeholder="Почта/номер телефона/никнейм" autocomplete=off><input id=p type=password placeholder="Пароль"><div class=mu style="color:#f23f43">${err||''}</div><button class=btn onclick=go()>${r?'Войти':'Зарегистрироваться'}</button><div class=mu>${r?`Совсем недавно? <a class=l onclick="mode='up';auth()">Регистрация</a>`:`Уже были? <a class="l gg" onclick="mode='in';auth()">Войти</a>`}</div></div>`,'auth')}
async function go(){const id=$('#i').value.trim(),pw=$('#p').value;if(!id||!pw)return auth('Заполните оба поля');
const k=K(id),ph=await H(pw),reg=mode=='up';cur='ld';show('<div class=dot></div>','ld');const t=sleep(6000);let nick;
try{if(!reg){nick=await G('idx/'+k);if(!nick){await t;return auth('Неверные данные')}await au.signInWithEmailAndPassword(E(nick),pw)}
else{if(await G('idx/'+k)){await t;return auth('Этот логин уже занят')}
const isP=/^\+?\d{10,15}$/.test(id);nick=(id.includes('@')?id.split('@')[0]:isP?'user'+id.slice(-4):id).replace(/[^\wа-яё]/gi,'').slice(0,20)||'user';
if(await G('idx/'+K(nick)))nick=nick.slice(0,15)+(Math.random()*9999|0);
const cr=await au.createUserWithEmailAndPassword(E(nick),pw);const u={nick,uid:cr.user.uid,avatar:{bg:PAL[Math.random()*15|0],e:EM[Math.random()*EM.length|0]},status:'on',phoneLinked:isP,created:Date.now()};if(isP)u.phone=id;
await db.ref().update({['users/'+nick]:u,['idx/'+k]:nick,['idx/'+K(nick)]:nick,['nicks/'+cr.user.uid]:nick})}
me=nick;await new Promise(res=>{let f=1;db.ref('users/'+me).on('value',s=>{U=s.val()||{};Object.keys(U.servers||{}).forEach(watch);Object.keys(U.friends||{}).forEach(fu);if(f){f=0;res()}else refresh()})});
await t;home()}catch(e){await t;auth(e.code=='auth/weak-password'?'Пароль минимум 6 символов':(e.code||'').startsWith('auth/')?'Неверные данные':'Ошибка сети')}}
function watch(id){if(W[id])return;W[id]=1;db.ref('servers/'+id).on('value',s=>{SV[id]=s.val();refresh()})}
function fu(n){if(FU[n])return;FU[n]=1;db.ref('users/'+n+'/avatar').on('value',s=>{FR[n]=s.val();refresh()})}
function refresh(){if($('.ov'))return;({home,n:notif,p:prof,srv:()=>openSrv(sid)})[cur]?.()}
function home(){cur='home';const sv=Object.keys(U.servers||{}),rq=Object.keys(U.requests||{}),fr=Object.entries(U.friends||{}).filter(x=>x[1]=='ok');
show(`<div class=tr><div class=oc onclick=welcome()>${sv.length?'💬':'👋'}</div><div class=sc style="background:#4e5058;color:#f23f43" onclick=mkSrv()>+</div></div><div class=top><h1>Личные сообщения</h1></div><div class=body><button class="btn b" style="width:calc(100% - 60px)" onclick=addF()>Добавить друзей</button>
<div class=row>${sv.map(i=>SV[i]?`<img class=sc src="${SV[i].icon||''}" onclick="openSrv('${i}')">`:'').join('')}</div>
${rq.map(n=>`<div class=li><b>${esc(n)}</b><span><a class=ic onclick="rq('${n}',0)">❌</a><a class=ic onclick="rq('${n}',1)">✅</a></span></div>`).join('')}
${fr.map(([n])=>`<div class=li onclick="openDM('${n}')">${av(FR[n])}<b>${esc(n)}</b></div>`).join('')}</div>`+nav())}
function welcome(){cur='w';show(`<div class=top><a class=bk onclick=home()>‹</a></div><div class="body c"><div style="font-size:80px">👋</div><h1>Привет, ${esc(me)}!</h1><div class=mu>Начните общение прямо сейчас выбирая две кнопки!</div><button class="btn s" onclick=join()>Войти по ссылке</button><button class="btn g" onclick=mkSrv()>Создать собственный сервер</button></div>`)}
function join(){const m=modal(`<h1>Войти по ссылке</h1><input id=jc placeholder="Код сервера"><button class=btn id=jb>Войти</button>`);$('#jb').onclick=async()=>{const id=$('#jc').value.trim();if(!id||!(await G('servers/'+id+'/name')))return toast('Сервер не найден');await db.ref().update({['users/'+me+'/servers/'+id]:true,['servers/'+id+'/members/'+me]:true});m.remove();home()}}
async function mkSrv(){await ld(4);ico='';cur='mk';show(`<div class=top><a class=bk onclick=home()>‹</a></div><div class="body c"><h1>Создайте свой сервер</h1><div class=mu>Начните общаться, развлекаться, приглашаться на собственном сервере!</div><div class=pick id=pk onclick="$('#f').click()">+</div><input type=file id=f accept="image/*" hidden><input id=nm placeholder="Название сервера"><button class=btn id=cb>Создать</button></div>`);
$('#nm').oninput=e=>{if(e.target.value.length>20)e.target.value=e.target.value.slice(0,20)};
$('#f').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);ico=c.toDataURL('image/jpeg',.8);$('#pk').innerHTML=`<img src="${ico}">`};im.src=URL.createObjectURL(f)};
$('#cb').onclick=async()=>{const name=$('#nm').value.trim();if(!name||!ico)return toast('Выберите файл и введите название');const b=$('#cb');b.className='btn s';b.textContent='Создание...';
const id=db.ref('servers').push().key;await db.ref().update({['servers/'+id]:{name,icon:ico,owner:me,created:Date.now(),members:{[me]:true}},['users/'+me+'/servers/'+id]:true});await sleep(4000);home()}}
function openSrv(id){cur='srv';sid=id;const s=SV[id];if(!s)return home();const ch=Object.entries(s.channels||{});
show(`<div class=top><a class=bk onclick=home()>‹</a><h1>${esc(s.name)}</h1></div><div class="body c"><div style="font-size:70px">🥂</div><h1>Поздравляем!</h1><div class=mu>Вы создали собственный сервер. Продолжайте в том же духе!</div><div class=mu onclick="navigator.clipboard.writeText('${id}');toast('Код скопирован')">Код приглашения: ${id}</div>
${ch.map(([c,v])=>`<div class=li style="width:100%" onclick="openCh('${c}')"><b># ${esc(v.name)}</b></div>`).join('')}<button class=btn onclick=mkCh() style="margin-top:auto">Создать канал</button></div>`)}
function mkCh(){const m=modal(`<h1 style="text-align:center">Создать канал</h1><input id=cn placeholder="# название"><button class=btn id=cc>Создать канал</button>`);
$('#cn').oninput=e=>e.target.value=e.target.value.toLowerCase().replace(/[^a-z0-9_-]/g,'');
$('#cc').onclick=async()=>{const n=$('#cn').value;if(!n)return;const c=db.ref('servers/'+sid+'/channels').push().key;await db.ref('servers/'+sid+'/channels/'+c).set({name:n,created:Date.now()});m.remove();SV[sid].channels={...SV[sid].channels,[c]:{name:n}};openCh(c)}}
function openCh(c){chat('messages/'+sid+'/'+c,'# '+SV[sid].channels[c].name,'openSrv(sid)')}
async function openDM(n){const pair=[me,n].sort().join('_'),w=await G('dmMeta/'+pair+'/waved');chat('dm/'+pair,n,'home()',w?'':pair,n)}
function chat(path,title,back,pair,peer){cur='chat';show(`<div class=top><a class=bk onclick="${back}">‹</a><h1 ${peer?`onclick="showU('${peer}')"`:''}>${esc(title)}</h1></div><div class=body id=ml style="gap:0"></div>${pair?`<div class=bar id=wv><button class="btn s" onclick="wave('${path}','${pair}')">Помахать вашему другу 👋</button></div>`:''}<div class=bar><input id=mi placeholder="Сообщение" autocomplete=off><div class=send onclick="send('${path}')">➤</div></div>`);
$('#mi').onkeydown=e=>{if(e.key=='Enter')send(path)};if(ref0)ref0.off();ref0=db.ref(path).limitToLast(200);const ml=$('#ml');
ref0.on('child_added',s=>{const v=s.val(),d=document.createElement('div');d.className='m';d.dataset.t=v.text;d.innerHTML=`<b>${esc(v.from)}</b><div>${esc(v.text)}</div>`;const near=ml.scrollHeight-ml.scrollTop-ml.clientHeight<80;ml.appendChild(d);if(near||v.from==me)ml.scrollTop=ml.scrollHeight});
let t;ml.onpointerdown=e=>{const m=e.target.closest('.m');if(m)t=setTimeout(()=>{navigator.clipboard.writeText(m.dataset.t);toast('Сообщение скопировано')},3000)};ml.onpointerup=ml.onpointerleave=ml.onpointercancel=()=>clearTimeout(t)}
function send(path){const i=$('#mi'),t=i.value.trim();if(!t)return;i.value='';db.ref(path).push({from:me,text:t.slice(0,2000),ts:TS})}
function wave(path,pair){db.ref(path).push({from:me,text:'👋',ts:TS});db.ref('dmMeta/'+pair+'/waved').set(true);$('#wv').remove()}
async function showU(n){const u={avatar:await G('users/'+n+'/avatar'),status:await G('users/'+n+'/status')};if(u.avatar)modal(`<div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px">${av(u.avatar)}<h1>${esc(n)}</h1><div class=mu>${u.status=='off'?'Не в сети':'В сети'}</div></div>`)}
function addF(){const m=modal(`<h1>Добавить друзей</h1><div class=mu>Добавьте своего друга в UezChat.</div><input id=fu placeholder="Юзернейм"><button class="btn b" style="border-radius:0" id=fb>Отправить запрос дружбы</button>`);
$('#fb').onclick=async()=>{const n=await G('idx/'+K($('#fu').value||'_'));if(!n||n==me)return toast('Пользователь не найден');await db.ref('users/'+n+'/requests/'+me).set(true);m.remove();toast('Запрос дружбы отправлен!')}}
async function rq(n,ok){const u={['users/'+me+'/requests/'+n]:null};if(ok){u['users/'+me+'/friends/'+n]='ok';u['users/'+n+'/friends/'+me]='ok'}await db.ref().update(u)}
function notif(){cur='n';show(`<div class=top><h1>Уведомления</h1></div><div class=body><div class=mu>Функция пока недоступна.</div></div>`+nav())}
function prof(){cur='p';const bk=JSON.stringify({...U,pass:undefined,serversData:Object.fromEntries(Object.entries(SV).map(([k,v])=>[k,v]))},(k,v)=>k=='icon'?'[img]':v,1);
show(`<div class=top><h1>${esc(me)}</h1></div><div class=body><div class=pa><div onclick=avm()>${av(U.avatar)}</div><i class="st ${U.status=='off'?'off':''}" onclick=tgl()></i></div>
${U.phoneLinked?'':`<div class=li style="flex-direction:column;align-items:stretch"><b>Защитите свой аккаунт</b><span class=mu>Привяжите номер телефона.</span><button class=btn onclick=ph()>Привязать</button></div>`}
<button class="btn g" onclick=tgl()>Сменить статус</button><pre>${esc(bk)}</pre></div>`+nav())}
const tgl=()=>db.ref('users/'+me+'/status').set(U.status=='off'?'on':'off');
function ph(){const m=modal(`<h1>Номер телефона</h1><input id=pn value="+" inputmode=tel><div class=mu>Только +1 и +7</div>`);let o='+';$('#pn').oninput=e=>{let v=e.target.value.replace(/[^\d+]/g,'');if(!/^\+([17]\d{0,10})?$/.test(v))v=o;e.target.value=o=v;if(v.length==12){db.ref('users/'+me).update({phone:v,phoneLinked:true});m.remove()}}}
function avm(){let bg=U.avatar.bg;const m=modal(`<h1>Создать аватар пользователя</h1><div class=row>${PAL.map(c=>`<div class="sw ${c==bg?'on':''}" style="background:${c}" data-c="${c}"></div>`).join('')}</div><input id=ae value="${U.avatar.e}" placeholder="Эмодзи"><button class=btn id=as>Сохранить</button>`);
m.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{bg=s.dataset.c;m.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x==s))});
$('#as').onclick=()=>{const e=Array.from($('#ae').value.trim())[0]||U.avatar.e;db.ref('users/'+me+'/avatar').set({bg,e});m.remove()}}
auth();
</script></body></html>
